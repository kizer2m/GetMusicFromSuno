<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get Music From Suno — AI-powered music generator using Suno API. Create unique songs with a premium interface.">
  <title>Get Music From Suno — AI Music Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="app-header" id="app-header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="13" stroke="url(#lg)" stroke-width="2"/>
            <circle cx="14" cy="14" r="5" fill="url(#lg)"/>
            <circle cx="14" cy="14" r="1.5" fill="#0a0a12"/>
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#6366f1"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="logo-text">Get Music From Suno</h1>
      </div>
    </div>
    <div class="header-right">
      <div class="balance-badge" id="balance-badge" title="API Credits Balance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        <span id="balance-value">Loading...</span>
      </div>
      <button class="theme-toggle" id="btn-theme" title="Toggle theme">
        <!-- Sun icon (shown in dark mode → click to go light) -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-sun">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon (shown in light mode → click to go dark) -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-moon" class="hidden">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span class="version-badge">v...</span>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="app-main" id="app-main">

    <!-- LEFT: Playlist -->
    <section class="panel panel-left" id="panel-playlist">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          Playlist
        </h2>
        <span class="track-count" id="track-count">0 tracks</span>
      </div>
      <div class="playlist-container" id="playlist-container">
        <div class="playlist-empty" id="playlist-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <p>No tracks yet</p>
          <span>Generate your first song!</span>
        </div>
        <ul class="playlist-list" id="playlist-list"></ul>
      </div>
    </section>

    <!-- RIGHT: Controls -->
    <section class="panel panel-right" id="panel-controls">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Generate
        </h2>
      </div>

      <div class="controls-body">
        <!-- Prompt -->
        <label class="field-label" for="prompt-input">Prompt</label>
        <textarea
          id="prompt-input"
          class="prompt-textarea"
          placeholder="Describe the music you want to create...&#10;e.g. Energetic synthwave track with retro vibes and pulsing bass"
          rows="5"
        ></textarea>

        <!-- Song count -->
        <label class="field-label" for="song-count">Number of Songs</label>
        <div class="count-row">
          <button class="count-btn" id="count-minus" title="Decrease">-</button>
          <input type="number" id="song-count" class="count-input" value="1" min="1" max="20">
          <button class="count-btn" id="count-plus" title="Increase">+</button>
        </div>

        <!-- Model & Format selectors (side by side) -->
        <div class="selectors-row">
          <div class="selector-group">
            <label class="field-label" for="model-select">Model</label>
            <div class="model-select-wrapper">
              <select id="model-select" class="model-select">
                <option value="V5_5" selected>Suno V5.5 — Latest</option>
                <option value="V4_5ALL">Suno V4.5</option>
                <option value="V4">Suno V4</option>
                <option value="V3_5">Suno V3.5</option>
              </select>
              <svg class="model-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
          <div class="selector-group">
            <label class="field-label" for="format-select">Format</label>
            <div class="model-select-wrapper">
              <select id="format-select" class="model-select">
                <option value="wav" selected>WAV</option>
                <option value="mp3">MP3</option>
              </select>
              <svg class="model-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="action-row">
          <button class="btn btn-generate" id="btn-generate" title="Start generating">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Generate
          </button>
          <button class="btn btn-reset" id="btn-reset" title="Reset all">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            Reset
          </button>
        </div>

        <!-- Progress -->
        <div class="progress-section" id="progress-section">
          <div class="progress-header">
            <span class="progress-label">Progress</span>
            <span class="progress-counter" id="progress-counter">0 / 0</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
          <p class="progress-status" id="progress-status">Ready</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== MINI PLAYER ===== -->
  <footer class="mini-player" id="mini-player">
    <!-- Full-width seek bar on top -->
    <div class="player-seek-top" id="player-seek-top">
      <div class="seek-bar-container" id="seek-bar-container">
        <div class="seek-bar-track" id="seek-bar-track">
          <div class="seek-bar-fill" id="seek-bar-fill"></div>
          <div class="seek-bar-thumb" id="seek-bar-thumb"></div>
        </div>
      </div>
    </div>

    <div class="player-bottom-row">
      <div class="player-track-info" id="player-track-info">
        <div class="player-art" id="player-art">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="player-meta">
          <span class="player-title" id="player-title">No track selected</span>
          <span class="player-subtitle" id="player-subtitle">Get Music From Suno</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="player-btn" id="btn-prev" title="Previous track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button class="player-btn player-btn-skip" id="btn-rewind" title="Rewind 10s">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 4v6h6"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span class="skip-label">10</span>
        </button>
        <button class="player-btn player-btn-play" id="btn-play" title="Play / Pause">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="icon-play">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="icon-pause" class="hidden">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="player-btn player-btn-skip" id="btn-forward" title="Forward 10s">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span class="skip-label">10</span>
        </button>
        <button class="player-btn" id="btn-next" title="Next track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>

      <div class="player-extra">
        <div class="player-time">
          <span id="player-current-time">0:00</span>
          <span class="time-separator">/</span>
          <span id="player-duration">0:00</span>
        </div>
        <span class="player-format-badge" id="player-format-badge">WAV</span>
        <button class="player-btn player-btn-volume" id="btn-volume" title="Mute / Unmute">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="icon-volume-on">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="icon-volume-off" class="hidden">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
